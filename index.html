<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta name="description" content="Watch This Today Now">

        <link rel="stylesheet" type="text/css" href="css.css">

        <title>Watch This Today Now</title>
    </head>
    <body>
       

        <main>
            <div class="movie-container">

                <div class="top-bar">
                    <h1><span class="watch-this">Watch This</span> 
                        <span class="today">Today</span> 
                        <span class="now">Now</span></h1>
                </div>
            
                <div class="movie-details">

                    <div class="poster-details-container">
                        <div class="movie-poster-container">
                            <img id="moviePoster" alt="Movie Poster">
                        </div>

                        <div class="movie-info-container">
                            <h2 id="titleElement"></h2>
                            <p id="overviewElement"></p>

                            <span id="movie-tag">

                            </span>

                            <div id="movieGenres">
                                <!-- Genres will be populated here -->
                            </div>

                            <div id="extra-details">

                            </div>
                        </div>
                    
                    </div>
                    
                    <div class="slider-wrapper">
                        
                        <button class="nav-btn prev-btn" id="prevBtn" aria-label="Previous slide">&#10094;</button>
                        <button class="nav-btn next-btn" id="nextBtn" aria-label="Next slide">&#10095;</button>

                        <div id="castList" class="slider-track">
                        <!-- Cast members will be populated here -->
                        
                        </div>

                        <script>
                            const slider = document.getElementById('castList');
                            const prevBtn = document.getElementById('prevBtn');
                            const nextBtn = document.getElementById('nextBtn');

                            prevBtn.addEventListener('click', () => {
                                slider.scrollBy({ left: -slider.clientWidth, behavior: 'smooth' });
                            });

                            nextBtn.addEventListener('click', () => {
                            slider.scrollBy({ left: slider.clientWidth, behavior: 'smooth' });
                            });
                        </script>
                    </div>
                </div>

            

            <script>
                // Date and number generation
                const date = new Date();
                let day = parseInt(String(date.getDate()).padStart(2, '0'));
                const year = date.getFullYear();
                const month = parseInt(String(date.getMonth() + 1).padStart(2, '0')); // Months are zero-based
   

                let fullNumber = year+month+day;

                let numberId = fullNumber * 7919 % 900000;

                console.log('Current Date:', date);
                console.log('Full Number:', fullNumber);
                console.log('Number ID:', numberId);

                // Specify the API endpoint
                let apiUrl = `https://api.themoviedb.org/3/movie/280?api_key=a8a8dd219f02ae2d11809c43d9b85222&append_to_response=credits`;

               
                // Make a GET request with authentication using the Fetch API
                async function fetchMovieData() {
                    const response = await fetch(apiUrl);

                    if (!response.ok) {
                        console.error('Network response was not ok:', response.statusText);
                        numberId = (numberId + 1) * 7919 % 900000;
                        console.log('New Number ID:', numberId);
                        //apiUrl = `https://api.themoviedb.org/3/movie/${numberId}&append_to_response=credits?api_key=a8a8dd219f02ae2d11809c43d9b85222`;
                        apiUrl = `https://api.themoviedb.org/3/movie/280?api_key=a8a8dd219f02ae2d11809c43d9b85222&append_to_response=credits`
                        return fetchMovieData();
                        
                    }

                    return response.json();
                }

                fetchMovieData()
                .then(movieData => {
                    const movieTitle = movieData.title;
                    const movieOverview = movieData.overview;
                    const movieCast = movieData.credits.cast;
                    const movieTag = movieData.tagline;
                    const movieGenre = movieData.genres;

                    const director = movieData.director;
                    const revenue = movieData.revenue;
                    const budget = movieData.budget;
                    const language = movieData.original_language;
                    const runtime = movieData.runtime;

                    console.log(`${movieData.credits.cast}`);

                    for (const castMember of movieCast) {
                        console.log(`${castMember.name} as ${castMember.character}`);
                    }

                    for (const genre of movieGenre) {
                        console.log(`Genre: ${genre.name}`);
                    }

                    document.getElementById('titleElement').textContent = movieTitle;
                    document.getElementById('overviewElement').textContent = movieOverview;
                    document.getElementById('moviePoster').src = `https://image.tmdb.org/t/p/w500${movieData.poster_path}`;
                    document.getElementById('movie-tag').textContent = movieTag;

                    // Create list foe genres
                    movieGenres.innerHTML = '';
                    for (const genre of movieGenre) {
                        const genreItem = document.createElement('div');
                        genreItem.classList.add('genre-item');
                        
                        genreItem.innerHTML =
                        `
                            <div class="genre-name">${genre.name}</div>
                        `;
                        movieGenres.appendChild(genreItem);
                    }

                    //document.createElement('ul');
                    castList.innerHTML = '';

                    for (const castMember of movieCast) {
                        const listItem = document.createElement('div');
                        listItem.classList.add('cast-member');

                        listItem.innerHTML =
                         `<div class="cast-picture">
                            <img src="https://image.tmdb.org/t/p/w92${castMember.profile_path}" 
                         alt="${castMember.name}">
                         </div>
                         <div class="cast-info">
                            <p class="cast-name">${castMember.name}</p> 
                            <p class="cast-character">${castMember.character}</p>                           
                         </div>
                         `;
                        castList.appendChild(listItem);
                    }

                    //document.getElementById('castList').textContent = 
                     //   movieCast.map(castMember => `${castMember.name} as ${castMember.character}`).join(', ');


                    
                })
                .catch(error => {
                    console.error('Could not fetch movie data:', error);
                });
            </script>
            </div>
        </main>
    </body>
</html>
