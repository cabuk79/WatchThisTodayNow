<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta name="description" content="Watch This Today Now">

        <link rel="stylesheet" type="text/css" href="css.css">

        <title>Watch This Today Now</title>
    </head>
    <body>
       
        <main>
            <div class="movie-container">

               

                <div class="top-bar">
                    <h1><span class="watch-this">Watch This</span> 
                        <span class="today">Today</span> 
                        <span class="now">Now</span></h1>
                </div>
            
                <div class="movie-details">

                    <div class="poster-details-container">
                        <div class="movie-poster-container">
                            <img id="moviePoster" alt="Movie Poster">
                        </div>

                        <div class="movie-info-container">
                            <h2 id="titleElement"></h2>
                            <p id="overviewElement"></p>

                            <span id="movie-tag">

                            </span>

                            <div id="movieGenres">
                                <!-- Genres will be populated here -->
                            </div>

                            <div id="extra-details">
                                <div class="director-container"></div>
                                <div class="revenue-container"></div>
                                <div class="budget-container"></div>
                                <div class="original-langauge"></div>
                                <div class="runtime"></div>
                            </div>
                        </div>
                    
                    </div>
                    
                    <div class="slider-wrapper">
                        
                        <button class="nav-btn prev-btn" id="prevBtn" aria-label="Previous slide">&#10094;</button>
                        <button class="nav-btn next-btn" id="nextBtn" aria-label="Next slide">&#10095;</button>

                        <div id="castList" class="slider-track">
                        <!-- Cast members will be populated here -->
                        
                        </div>

                        <script>
                            const slider = document.getElementById('castList');
                            const prevBtn = document.getElementById('prevBtn');
                            const nextBtn = document.getElementById('nextBtn');

                            prevBtn.addEventListener('click', () => {
                                slider.scrollBy({ left: -slider.clientWidth, behavior: 'smooth' });
                            });

                            nextBtn.addEventListener('click', () => {
                            slider.scrollBy({ left: slider.clientWidth, behavior: 'smooth' });
                            });
                        </script>
                    </div>
                </div>

                <script>
                    const date = new Date();
                    let day = parseInt(String(date.getDate()).padStart(2, '0'));
                    const year = date.getFullYear();
                    const month = parseInt(String(date.getMonth() + 1).padStart(2, '0'));

                    let fullNumber = year + month + day;
                    let numberId = (fullNumber * 7919) % 900000;

                    // Specify the API endpoint
                    let apiUrl = `https://api.themoviedb.org/3/movie/200?api_key=a8a8dd219f02ae2d11809c43d9b85222&append_to_response=credits`;

                    async function fetchMovieData() {
                        try {
                        const response = await fetch(apiUrl);
                        if (!response.ok) {
                            throw new Error('Network response was not ok');
                        }
                        return await response.json();
                        } catch (err) {
                        console.error('Fetch error:', err);
                        }
                    }

                    fetchMovieData().then((movieData) => {
                        if (!movieData) return;

                        // Fill Title & Overview
                        document.getElementById('titleElement').textContent = movieData.title || '';
                        document.getElementById('overviewElement').textContent = movieData.overview || '';
                        document.getElementById('movie-tag').textContent = movieData.tagline || '';

                        // Poster
                        const posterImg = document.getElementById('moviePoster');
                        if (movieData.poster_path) {
                        posterImg.src = `https://image.tmdb.org/t/p/w500${movieData.poster_path}`;
                        }

                        // Genres
                        const genresContainer = document.getElementById('movieGenres');
                        genresContainer.innerHTML = '';
                        if (movieData.genres) {
                        movieData.genres.forEach((genre) => {
                            const genreItem = document.createElement('div');
                            genreItem.classList.add('genre-item');
                            genreItem.innerHTML = `<div class="genre-name">${genre.name}</div>`;
                            genresContainer.appendChild(genreItem);
                        });
                        }

                        // Cast List
                        const castContainer = document.getElementById('castList');
                        castContainer.innerHTML = '';

                        if (movieData.credits && movieData.credits.cast) {
                        movieData.credits.cast.forEach((castMember) => {
                            const listItem = document.createElement('div');
                            listItem.classList.add('cast-member');

                            const profileImg = castMember.profile_path
                            ? `https://image.tmdb.org/t/p/w92${castMember.profile_path}`
                            : 'image-user.png';

                            listItem.innerHTML = `
                            <div class="cast-picture">
                                <img src="${profileImg}" alt="${castMember.name}">
                            </div>
                            <div class="cast-info">
                                <p class="cast-name">${castMember.name}</p> 
                                <p class="cast-character">${castMember.character || ''}</p> 
                            </div>
                            `;
                            castContainer.appendChild(listItem);
                        });
                        }
                    });
                    </script>

            
            </div>
        </main>
    </body>
</html>
